services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: takeway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: takeway
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U takeway"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
